<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Deadline Dash</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="orientation-message">
        <div>
            <h1>🔄 Rotate Your Device</h1>
            <p>Deadline Dash is designed to be played in landscape mode.</p>
        </div>
    </div>

    <div id="game-container">

        <canvas id="gameCanvas"></canvas>
        <div id="assignment-panel">
            <h2>ASSIGNMENT</h2>

            <p id="assignment-title">
                C Programming
            </p>

            <p id="assignment-task">
                Find the syntax error
            </p>

            <p id="assignment-status">
                Status: Not Started
            </p>
        </div>
        <div id="joystick">
            <div id="joystick-knob"></div>
        </div>

    </div>

    <script src="game.js"></script>

</body>
</html>
